name: ci

on:
  pull_request:
    branches:
      - main
      - develop
      - ci-cd
  push:
    branches:
      - main
      - develop
      - ci-cd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: ci / repository-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check governance files
        shell: bash
        run: |
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .github/apps.yml
          test -f docs/ai/github-ai-policy.md
          test -f docs/ai/ai-engine-routing.md

  backend:
    name: ci / backend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\iLiniumTech.Backend\iLiniumTech.Backend.slnx

      - name: Build
        run: dotnet build .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: ci / frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: iLiniumTech.Frontend/package-lock.json

      - name: Install
        working-directory: iLiniumTech.Frontend
        run: npm ci

      - name: Lint
        working-directory: iLiniumTech.Frontend
        run: npm run lint

      - name: Unit tests
        working-directory: iLiniumTech.Frontend
        run: npm run test:unit:ci

      - name: Build
        working-directory: iLiniumTech.Frontend
        run: npm run build

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: iLiniumTech.Frontend/reports
          if-no-files-found: ignore
