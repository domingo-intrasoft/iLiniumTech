name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\iLiniumTech.Backend\iLiniumTech.Backend.slnx

      - name: Build
        run: dotnet build .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: windows-latest

    defaults:
      run:
        working-directory: iLiniumTech.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: iLiniumTech.Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prepare reports
        shell: pwsh
        run: New-Item -ItemType Directory -Force reports | Out-Null

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build
        run: npm run build

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: iLiniumTech.Frontend/reports/*.xml
          if-no-files-found: ignore
