name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-docs:
    name: Documentation and hygiene
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Documentation baseline
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/quality/Test-DocumentationBaseline.ps1

      - name: Git whitespace check
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          }
          else {
            git diff --check
          }

      - name: Write quality summary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force quality-reports | Out-Null
          @(
            "# CI Quality Summary",
            "",
            "- Documentation baseline: see job result.",
            "- Git whitespace check: see job result.",
            "- Preview/deploy: not executed from CI; use preview dry-run workflow."
          ) | Set-Content -Path quality-reports/ci-quality-summary.md -Encoding utf8

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-reports
          path: quality-reports/**
          if-no-files-found: ignore

  backend:
    name: Backend build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\iLiniumTech.Backend\iLiniumTech.Backend.slnx

      - name: Build
        run: dotnet build .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\iLiniumTech.Backend\iLiniumTech.Backend.slnx --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: windows-latest

    defaults:
      run:
        working-directory: iLiniumTech.Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: iLiniumTech.Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prepare reports
        shell: pwsh
        run: New-Item -ItemType Directory -Force reports | Out-Null

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build
        run: npm run build

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: iLiniumTech.Frontend/reports/*.xml
          if-no-files-found: ignore
